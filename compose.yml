services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incarail_app
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incarail_worker
    working_dir: /var/www/backend
    command: php artisan queue:work redis --tries=3 --timeout=60
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: incarail_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    container_name: incarail_db
    environment:
      POSTGRES_DB: incarail_football
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incarail_football"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: incarail_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incarail_frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - nginx

volumes:
  pgdata: